audio:
  sample_rate: 16000
  channels: 1
  silence_threshold: 0.015
  silence_duration_ms: 1500
  max_duration_s: 30
  device: "default"

agent:
  mode: "voice_gateway"       # voice_gateway | legacy_native
  zeroclaw:
    binary: "/usr/local/bin/zeroclaw"
    agent_alias: "xarlatan"
    cwd: "/var/lib/xarlatan/workspace"

voice:
  worker:
    script: "/usr/local/lib/xarlatan/openvino_voice_worker.py"
  vad:
    model: "/var/lib/xarlatan/models/vad/silero_vad.onnx"
  stt:
    python: "/opt/xarlatan/voice/stt-venv/bin/python"
    model_dir: "/var/lib/xarlatan/models/openvino/whisper-base"
    language: "es"
    device: "GPU"
    fallback_device: "CPU"
    cache_dir: "/var/lib/xarlatan/cache/openvino/stt"
  tts:
    python: "/opt/xarlatan/voice/tts-venv/bin/python"
    model_dir: "/var/lib/xarlatan/models/openvino/kokoro"
    voice_file: "/var/lib/xarlatan/models/openvino/kokoro/voices-v1.0.bin"
    language: "es"
    device: "GPU"
    fallback_device: "CPU"
    cache_dir: "/var/lib/xarlatan/cache/openvino/tts"

# Legacy native agent and sherpa/VITS voice settings remain only for rollback
# while v0.6 is physically validated. They are ignored in voice_gateway mode.
stt:
  encoder: "models/stt/sherpa-onnx-whisper-base/base-encoder.onnx"
  decoder: "models/stt/sherpa-onnx-whisper-base/base-decoder.onnx"
  tokens: "models/stt/sherpa-onnx-whisper-base/base-tokens.txt"
  language: "es"
  translate: false

llm:
  mode: "managed"
  server_binary: "./bin/llama-server"
  model: "models/llm/qwen2.5-0.5b-instruct-q4_k_m.gguf"
  host: "127.0.0.1"
  port: 8080
  context_size: 4096
  n_gpu_layers: 0
  threads: 4
  startup_timeout_ms: 60000
  shutdown_timeout_ms: 5000
  health_interval_ms: 250
  temperature: 0.7
  top_p: 0.9
  max_tokens: 512
  system_prompt: "Eres un asistente de voz inteligente y conciso. Responde siempre en el mismo idioma que el usuario. Sé breve y directo."

tts:
  model: "models/tts/vits-piper-es_ES-davefx-medium/es_ES-davefx-medium.onnx"
  tokens: "models/tts/vits-piper-es_ES-davefx-medium/tokens.txt"
  data_dir: "models/tts/vits-piper-es_ES-davefx-medium/espeak-ng-data"
  speaker_id: 0
  length_scale: 1.0
  noise_scale: 0.667
  noise_w: 0.8

tools:
  filesystem:
    enabled: false
    root: ""
    allow_mutations: false
    max_read_bytes: 1048576
    max_write_bytes: 1048576
  web_search:
    provider: "duckduckgo"
    api_key: ""
    base_url: ""

log:
  level: "info"
  file: ""
