name: release candidate

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release candidate version"
        required: true
        default: "v0.4.0-beta.1"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      SOURCE_DATE_EPOCH: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git curl bzip2 alsa-utils libasound2-dev shellcheck

      - name: Verify source and Go gates
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -coverprofile=coverage.out ./...
          go test -count=20 \
            ./internal/orchestrator ./internal/tools ./internal/llm \
            ./internal/memory ./internal/audio ./internal/conversation ./internal/application
          go test -race -count=1 \
            ./internal/orchestrator ./internal/tools ./internal/llm \
            ./internal/memory ./internal/audio ./internal/conversation ./internal/application

      - name: Verify operational contracts
        run: |
          shellcheck \
            scripts/install.sh scripts/uninstall.sh scripts/rollback.sh \
            scripts/download_models.sh scripts/preflight.sh \
            scripts/beta_acceptance.sh scripts/package_release.sh \
            scripts/tests/wi08_contract_test.sh scripts/tests/wi09_contract_test.sh
          bash scripts/tests/wi08_contract_test.sh
          bash scripts/tests/wi09_contract_test.sh
          sudo install -Dm755 /bin/true /usr/local/bin/xarlatan
          sudo systemd-analyze verify packaging/systemd/xarlatan.service
          sudo systemd-analyze security --offline=yes --threshold=50 packaging/systemd/xarlatan.service

      - name: Build full candidate
        run: make clean-all all VERSION="$VERSION"

      - name: Verify embedded version
        run: test "$(./bin/assistant -version)" = "assistant $VERSION"

      - name: Package candidate
        run: make release-candidate VERSION="$VERSION"

      - name: Verify archive checksum
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: xarlatan-${{ env.VERSION }}-linux-amd64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            coverage.out
          if-no-files-found: error
