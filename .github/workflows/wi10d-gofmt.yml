name: wi10d one-shot gofmt

on:
  push:
    branches:
      - "agent/wi-10d-continuous-wake"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-10d-continuous-wake
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Apply gofmt and remove this workflow
        run: |
          gofmt -w internal/audio/continuous_capture.go
          rm .github/workflows/wi10d-gofmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/audio/continuous_capture.go .github/workflows/wi10d-gofmt.yml
          git commit -m "style(WI-10D): format continuous capture"
          git push origin HEAD:agent/wi-10d-continuous-wake
