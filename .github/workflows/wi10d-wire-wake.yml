name: wi10d one-shot wire wake

on:
  push:
    branches:
      - "agent/wi-10d-continuous-wake"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-10d-continuous-wake
      - name: Wire wake gate into coordinator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('internal/application/coordinator.go')
          text = p.read_text()
          old = '''type Coordinator struct {
          dependencies Dependencies
          sequence     atomic.Uint64
          interrupts   InterruptSource
          }'''.replace('          ', '\t')
          new = '''type Coordinator struct {
          dependencies Dependencies
          sequence     atomic.Uint64
          interrupts   InterruptSource
          wake         WakeDetector
          }'''.replace('          ', '\t')
          if old not in text:
              raise SystemExit('Coordinator anchor not found')
          text = text.replace(old, new, 1)

          old = '''\tresult.Trace.TranscriptChars = len(transcript)
          \tc.dependencies.View.ShowUser(transcript)

          \trecorder.emit(StateThinking)'''.replace('          ', '')
          new = '''\tresult.Trace.TranscriptChars = len(transcript)
          \tvar accepted bool
          \ttranscript, accepted = c.applyWakeGate(transcript, recorder, &result)
          \tif !accepted {
          \t\treturn result, nil
          \t}
          \tc.dependencies.View.ShowUser(transcript)

          \trecorder.emit(StateThinking)'''.replace('          ', '')
          if old not in text:
              raise SystemExit('transcript anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          gofmt -w internal/application/coordinator.go internal/application/wake.go
          rm .github/workflows/wi10d-wire-wake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/application/coordinator.go internal/application/wake.go .github/workflows/wi10d-wire-wake.yml
          git commit -m "feat(WI-10D): wire wake gate into coordinator"
          git push origin HEAD:agent/wi-10d-continuous-wake
