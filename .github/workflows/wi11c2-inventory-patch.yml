name: wi11c2 one-shot inventory patch

on:
  push:
    branches:
      - "agent/wi-11c2-partial-stt"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-11c2-partial-stt
      - name: Add WI-11C2 inventory contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/baseline-inventory.yml')
          text = p.read_text()
          additions = [
              ('          test -f internal/audio/barge_capture_test.go\n',
               '          test -f internal/audio/partial_capture_test.go\n'),
              ('          test -f internal/application/barge_in_test.go\n',
               '          test -f internal/application/transcript.go\n          test -f internal/application/transcript_test.go\n'),
              ('          test -f cmd/assistant/capture_gate_observer_test.go\n',
               '          test -f cmd/assistant/transcript_observer.go\n          test -f cmd/assistant/transcript_metric.go\n          test -f cmd/assistant/wi11c2_test.go\n'),
              ('          test -f docs/refactor/WI-11C1_SPEC.md\n',
               '          test -f docs/refactor/WI-11C2_SPEC.md\n'),
          ]
          for anchor, addition in additions:
              for line in addition.splitlines(keepends=True):
                  if line.strip() and line in text:
                      continue
              if addition in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f'anchor missing: {anchor!r}')
              text = text.replace(anchor, anchor + addition, 1)
          p.write_text(text)
          PY
          rm .github/workflows/wi11c2-inventory-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/baseline-inventory.yml .github/workflows/wi11c2-inventory-patch.yml
          git commit -m "ci(WI-11C2): inventory partial STT contracts"
          git push origin HEAD:agent/wi-11c2-partial-stt
