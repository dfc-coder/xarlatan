name: wi11c2 one-shot application patch

on:
  push:
    branches:
      - "agent/wi-11c2-partial-stt"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-11c2-partial-stt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Wire partial STT lifecycle and metric
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('internal/application/application.go')
          text = p.read_text()
          text = text.replace(
              '\tFirstResponseDelta time.Duration\n',
              '\tFirstSTTPartial    time.Duration\n\tFirstResponseDelta time.Duration\n',
              1,
          )
          text = text.replace(
              '\tfirstResponseDelta time.Duration\n\tfirstAudio         time.Duration\n',
              '\tfirstSTTPartial    time.Duration\n\tfirstResponseDelta time.Duration\n\tfirstAudio         time.Duration\n',
              1,
          )
          marker = '''func (r *turnRecorder) markFirstResponseDelta() {
'''
          method = '''func (r *turnRecorder) markFirstSTTPartial(latency time.Duration) {
\tif r != nil && r.firstSTTPartial == 0 && latency > 0 {
\t\tr.firstSTTPartial = latency
\t}
}

'''
          if marker not in text:
              raise SystemExit('turn recorder method marker missing')
          text = text.replace(marker, method + marker, 1)
          text = text.replace(
              '\ttrace.TotalDuration = positiveDuration(now.Sub(r.started))\n\tif trace.FirstResponseDelta == 0 {\n',
              '\ttrace.TotalDuration = positiveDuration(now.Sub(r.started))\n\tif trace.FirstSTTPartial == 0 {\n\t\ttrace.FirstSTTPartial = r.firstSTTPartial\n\t}\n\tif trace.FirstResponseDelta == 0 {\n',
              1,
          )
          p.write_text(text)

          p = Path('internal/application/coordinator.go')
          text = p.read_text()
          text = text.replace(
              '\tinterrupts   InterruptSource\n\twake         WakeDetector\n',
              '\tinterrupts   InterruptSource\n\twake         WakeDetector\n\ttranscripts  TranscriptObserver\n',
              1,
          )
          text = text.replace(
              '\treturn &Coordinator{dependencies: dependencies}, nil\n',
              '\treturn &Coordinator{dependencies: dependencies, transcripts: nopTranscriptObserver{}}, nil\n',
              1,
          )
          old = '''\trecorder.emit(StateListening)
\tcapture, stageErr := workers.execute(turnCtx, stageCapture, stageRequest{turnID: turnID, ctx: turnCtx})
\tif stageErr != nil {
\t\treturn c.fail(turnCtx, recorder, result, ErrorCaptureFailed, stageErr)
\t}
'''
          new = '''\trecorder.emit(StateListening)
\tpartialCtx, cancelPartial := context.WithCancel(turnCtx)
\tpartialResult := c.startPartialSTT(partialCtx, turnID, recorder.started)
\tcapture, stageErr := workers.execute(turnCtx, stageCapture, stageRequest{turnID: turnID, ctx: turnCtx})
\tcancelPartial()
\tconsumePartialSTT(partialResult, turnID, recorder)
\tif stageErr != nil {
\t\treturn c.fail(turnCtx, recorder, result, ErrorCaptureFailed, stageErr)
\t}
'''
          if old not in text:
              raise SystemExit('capture lifecycle anchor missing')
          text = text.replace(old, new, 1)
          old = '''\ttranscript := strings.TrimSpace(transcription.text)
\tif transcript == "" {
'''
          new = '''\ttranscript := strings.TrimSpace(transcription.text)
\tc.transcriptObserver().OnTranscript(TranscriptEvent{TurnID: turnID, Kind: TranscriptFinal, Text: transcript})
\tif transcript == "" {
'''
          if old not in text:
              raise SystemExit('final transcript anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          gofmt -w internal/application/application.go internal/application/coordinator.go internal/application/transcript.go internal/application/transcript_test.go
          rm .github/workflows/wi11c2-app-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/application/application.go internal/application/coordinator.go internal/application/transcript.go internal/application/transcript_test.go .github/workflows/wi11c2-app-patch.yml
          git commit -m "feat(WI-11C2): wire partial and final transcript lifecycle"
          git push origin HEAD:agent/wi-11c2-partial-stt
