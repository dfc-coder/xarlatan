name: wi11a one-shot inventory finalize

on:
  push:
    branches:
      - "agent/wi-11a-streaming-replies"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-11a-streaming-replies
      - name: Add final WI-11A inventory contracts and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/baseline-inventory.yml')
          text = p.read_text()
          additions = [
              ('          test -f internal/application/coordinator_stream_errors_test.go\n',
               '          test -f internal/application/coordinator_stale_delta_test.go\n'),
              ('          test -f cmd/assistant/main_test.go\n',
               '          test -f cmd/assistant/wi11a_test.go\n'),
          ]
          for anchor, line in additions:
              if line not in text:
                  if anchor not in text:
                      raise SystemExit(f'anchor missing: {anchor!r}')
                  text = text.replace(anchor, anchor + line, 1)
          p.write_text(text)
          PY
          rm .github/workflows/wi11a-finalize-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/baseline-inventory.yml .github/workflows/wi11a-finalize-inventory.yml
          git commit -m "ci(WI-11A): finalize streaming inventory contracts"
          git push origin HEAD:agent/wi-11a-streaming-replies
