name: wi11c2 one-shot audio patch

on:
  push:
    branches:
      - "agent/wi-11c2-partial-stt"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-11c2-partial-stt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Add bounded partial snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('internal/audio/continuous_capture.go')
          text = p.read_text()

          text = text.replace(
              'defaultBargeCandidateDepth     = 2\n',
              'defaultBargeCandidateDepth     = 2\n\tdefaultPartialSnapshotDepth    = 1\n\tpartialPreviewDuration         = time.Second\n',
              1,
          )

          anchor = '''type BargeCandidate struct {
\tBuffer    Buffer
\tStartedAt time.Time
\tPeakRMS   float64
}
'''
          addition = anchor + '''
// PartialAudio is a single bounded snapshot captured before a normal utterance
// reaches the Silero endpoint. It is private data-plane input to preview STT.
type PartialAudio struct {
\tBuffer     Buffer
\tCapturedAt time.Time
}
'''
          if anchor not in text:
              raise SystemExit('BargeCandidate anchor missing')
          text = text.replace(anchor, addition, 1)

          text = text.replace(
              '\tutterances      chan Buffer\n\tbargeCandidates chan BargeCandidate\n\tsourceErr       chan error\n',
              '\tutterances      chan Buffer\n\tpartials        chan PartialAudio\n\tbargeCandidates chan BargeCandidate\n\tsourceErr       chan error\n',
              1,
          )
          text = text.replace(
              '\tdropped    atomic.Uint64\n\tsuppressed atomic.Bool\n',
              '\tdropped    atomic.Uint64\n\tsuppressed atomic.Bool\n\twaiting    atomic.Bool\n',
              1,
          )
          text = text.replace(
              '\t\tutterances:      make(chan Buffer, options.QueueDepth),\n\t\tbargeCandidates: make(chan BargeCandidate, defaultBargeCandidateDepth),\n',
              '\t\tutterances:      make(chan Buffer, options.QueueDepth),\n\t\tpartials:        make(chan PartialAudio, defaultPartialSnapshotDepth),\n\t\tbargeCandidates: make(chan BargeCandidate, defaultBargeCandidateDepth),\n',
              1,
          )

          old = '''\tctx = nonNilCaptureContext(ctx)
\tif err := ctx.Err(); err != nil {
\t\treturn Buffer{}, err
\t}

\t// Prefer already-buffered speech before deciding whether the source needs
'''
          new = '''\tctx = nonNilCaptureContext(ctx)
\tif err := ctx.Err(); err != nil {
\t\treturn Buffer{}, err
\t}
\tr.resetPartials()
\tr.waiting.Store(true)
\tdefer r.waiting.Store(false)

\t// Prefer already-buffered speech before deciding whether the source needs
'''
          if old not in text:
              raise SystemExit('Next anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''func (r *ContinuousRecorder) BargeCandidates() <-chan BargeCandidate {
\tif r == nil {
\t\treturn nil
\t}
\treturn r.bargeCandidates
}
'''
          addition = '''// PartialAudio exposes a single-slot private preview stream. Snapshots are
// produced only while one Next call is actively waiting for the current turn.
func (r *ContinuousRecorder) PartialAudio() <-chan PartialAudio {
\tif r == nil {
\t\treturn nil
\t}
\treturn r.partials
}

''' + anchor
          if anchor not in text:
              raise SystemExit('BargeCandidates anchor missing')
          text = text.replace(anchor, addition, 1)

          text = text.replace(
              '\tvar recording []float32\n\twasSuppressed := r.suppressed.Load()\n',
              '\tvar recording []float32\n\tpartialSent := false\n\twasSuppressed := r.suppressed.Load()\n',
              1,
          )

          old = '''\t\t\tif r.suppressed.Load() {
\t\t\t\tif !wasSuppressed {
\t\t\t\t\tr.vad.Reset()
\t\t\t\t\tr.preRoll.reset()
\t\t\t\t\tbarge.reset()
\t\t\t\t\twasSuppressed = true
\t\t\t\t}
\t\t\t\trecording = nil
'''
          new = '''\t\t\tif r.suppressed.Load() {
\t\t\t\tif !wasSuppressed {
\t\t\t\t\tr.vad.Reset()
\t\t\t\t\tr.preRoll.reset()
\t\t\t\t\tbarge.reset()
\t\t\t\t\twasSuppressed = true
\t\t\t\t}
\t\t\t\trecording = nil
\t\t\t\tpartialSent = false
\t\t\t\tr.resetPartials()
'''
          if old not in text:
              raise SystemExit('suppressed branch anchor missing')
          text = text.replace(old, new, 1)

          old = '''\t\t\t\tvar finish bool
\t\t\t\trecording, finish = r.processChunk(recording, chunk)
\t\t\t\tif finish {
\t\t\t\t\tr.publishUtterance(recording)
\t\t\t\t\trecording = nil
\t\t\t\t\tr.vad.Reset()
\t\t\t\t\tr.preRoll.reset()
\t\t\t\t}
'''
          new = '''\t\t\t\tvar finish bool
\t\t\t\trecording, finish = r.processChunk(recording, chunk)
\t\t\t\tpartialSent = r.maybePublishPartial(recording, partialSent)
\t\t\t\tif finish {
\t\t\t\t\tr.publishUtterance(recording)
\t\t\t\t\trecording = nil
\t\t\t\t\tpartialSent = false
\t\t\t\t\tr.vad.Reset()
\t\t\t\t\tr.preRoll.reset()
\t\t\t\t}
'''
          if old not in text:
              raise SystemExit('normal chunk anchor missing')
          text = text.replace(old, new, 1)

          marker = 'func (r *ContinuousRecorder) publishUtterance(samples []float32) {'
          methods = '''func (r *ContinuousRecorder) maybePublishPartial(recording []float32, alreadySent bool) bool {
\tif alreadySent || r == nil || !r.waiting.Load() || len(recording) == 0 {
\t\treturn alreadySent
\t}
\tthreshold := int(float64(r.cfg.SampleRate*r.cfg.Channels) * partialPreviewDuration.Seconds())
\tif len(recording) < threshold {
\t\treturn false
\t}
\tr.publishPartial(PartialAudio{
\t\tBuffer: Buffer{
\t\t\tSamples:    append([]float32(nil), recording...),
\t\t\tSampleRate: r.cfg.SampleRate,
\t\t\tChannels:   r.cfg.Channels,
\t\t},
\t\tCapturedAt: time.Now(),
\t})
\treturn true
}

func (r *ContinuousRecorder) publishPartial(preview PartialAudio) {
\tif r == nil || r.partials == nil || preview.Buffer.Empty() {
\t\treturn
\t}
\tselect {
\tcase r.partials <- preview:
\t\treturn
\tdefault:
\t}
\tselect {
\tcase <-r.partials:
\tdefault:
\t}
\tselect {
\tcase r.partials <- preview:
\tdefault:
\t}
}

func (r *ContinuousRecorder) resetPartials() {
\tif r == nil || r.partials == nil {
\t\treturn
\t}
\tfor {
\t\tselect {
\t\tcase <-r.partials:
\t\tdefault:
\t\t\treturn
\t\t}
\t}
}

'''
          if marker not in text:
              raise SystemExit('publishUtterance marker missing')
          text = text.replace(marker, methods + marker, 1)
          p.write_text(text)
          PY
          gofmt -w internal/audio/continuous_capture.go internal/audio/partial_capture_test.go
          rm .github/workflows/wi11c2-audio-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/audio/continuous_capture.go internal/audio/partial_capture_test.go .github/workflows/wi11c2-audio-patch.yml
          git commit -m "feat(WI-11C2): emit one bounded partial snapshot per utterance"
          git push origin HEAD:agent/wi-11c2-partial-stt
