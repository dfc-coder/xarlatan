name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"
      - "agent/**"
      - "hotfix/**"
      - "delivery/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Install native and operational dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends alsa-utils libasound2-dev shellcheck python3

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        run: make format-check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Enforce focused coverage
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -coverprofile=memory-coverage.out ./internal/memory
          go test -count=1 -coverprofile=application-coverage.out ./internal/application
          go test -count=1 -coverprofile=conversation-coverage.out ./internal/conversation
          go test -count=1 -coverprofile=audio-coverage.out ./internal/audio
          go test -count=1 -coverprofile=vad-coverage.out ./internal/vad
          go test -count=1 -coverprofile=sherpa-vad-coverage.out ./internal/vad/sherpa
          go test -count=1 -coverprofile=wake-coverage.out ./internal/wake
          go test -count=1 -coverprofile=barge-coverage.out ./internal/barge
          go test -count=1 -coverprofile=inference-coverage.out ./internal/inference
          go test -count=1 -coverprofile=zeroclaw-coverage.out ./internal/zeroclaw

          enforce() {
            local name="$1"
            local file="$2"
            local minimum="$3"
            local coverage
            coverage="$(go tool cover -func="$file" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
            awk -v coverage="$coverage" -v minimum="$minimum" 'BEGIN { if ((coverage + 0) < (minimum + 0)) exit 1 }'
            printf '%s coverage: %s%%\n' "$name" "$coverage"
          }

          enforce memory memory-coverage.out 80
          enforce application application-coverage.out 80
          enforce conversation conversation-coverage.out 80
          enforce audio audio-coverage.out 51.1
          enforce vad vad-coverage.out 90.1
          enforce sherpa-vad sherpa-vad-coverage.out 75
          enforce wake wake-coverage.out 80
          enforce barge barge-coverage.out 80
          enforce inference inference-coverage.out 70
          enforce zeroclaw zeroclaw-coverage.out 70

      - name: Repeat focused tests
        run: go test -count=20 ./internal/orchestrator ./internal/tools ./internal/llm ./internal/memory ./internal/vad/... ./internal/wake ./internal/barge ./internal/audio ./internal/conversation ./internal/application ./internal/inference ./internal/zeroclaw

      - name: Race-test focused packages
        run: go test -race -count=1 ./internal/orchestrator ./internal/tools ./internal/llm ./internal/memory ./internal/vad/... ./internal/wake ./internal/barge ./internal/audio ./internal/conversation ./internal/application ./internal/inference ./internal/zeroclaw

      - name: Verify voice worker and operational scripts
        run: |
          python3 -m py_compile scripts/openvino_voice_worker.py
          bash -n scripts/setup_voice_runtime.sh
          bash -n scripts/beta_v06_acceptance.sh

      - name: Build and verify version
        run: |
          make clean build
          test "$(./bin/assistant -version)" = "assistant v0.6.0-beta.1"
          test -x ./bin/calibrate
          test ! -e ./bin/llama-server

      - name: Verify shell and release contracts
        run: |
          shellcheck --exclude=SC2016 \
            scripts/install.sh scripts/uninstall.sh scripts/rollback.sh \
            scripts/download_models.sh scripts/preflight.sh \
            scripts/beta_acceptance.sh scripts/beta_v05_acceptance.sh scripts/beta_v06_acceptance.sh \
            scripts/package_release.sh scripts/setup_voice_runtime.sh \
            scripts/collect_runtime_libs.sh scripts/gofmt_guard.sh \
            scripts/tests/wi08_contract_test.sh scripts/tests/wi09_contract_test.sh \
            scripts/tests/wi11d_contract_test.sh scripts/tests/v06_contract_test.sh
          bash scripts/tests/wi08_contract_test.sh
          bash scripts/tests/wi09_contract_test.sh
          bash scripts/tests/wi11d_contract_test.sh
          bash scripts/tests/v06_contract_test.sh

      - name: Verify systemd user unit and hardening
        run: |
          sudo install -Dm755 /bin/true /usr/local/bin/xarlatan
          systemd-analyze verify packaging/systemd/xarlatan.service
          systemd-analyze security --offline=yes --threshold=50 packaging/systemd/xarlatan.service

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            memory-coverage.out
            application-coverage.out
            conversation-coverage.out
            audio-coverage.out
            vad-coverage.out
            sherpa-vad-coverage.out
            wake-coverage.out
            barge-coverage.out
            inference-coverage.out
            zeroclaw-coverage.out
