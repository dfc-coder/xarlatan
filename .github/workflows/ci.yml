name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"
      - "agent/**"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends alsa-utils libasound2-dev

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted files:\n%s\n' "$unformatted"
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Repeat agent, tool, and LLM lifecycle tests
        run: go test -count=20 ./internal/orchestrator ./internal/tools ./internal/llm

      - name: Race-test agent, tools, and LLM lifecycle
        run: go test -race -count=1 ./internal/orchestrator ./internal/tools ./internal/llm

      - name: Build commands
        run: go build ./cmd/assistant ./cmd/calibrate

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
