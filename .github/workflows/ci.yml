name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"
      - "agent/**"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends alsa-utils libasound2-dev

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted files:\n%s\n' "$unformatted"
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Enforce focused coverage
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -coverprofile=memory-coverage.out ./internal/memory
          go test -count=1 -coverprofile=application-coverage.out ./internal/application
          go test -count=1 -coverprofile=conversation-coverage.out ./internal/conversation

          enforce() {
            local name="$1"
            local file="$2"
            local minimum="$3"
            local coverage
            coverage="$(go tool cover -func="$file" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
            awk -v coverage="$coverage" -v minimum="$minimum" 'BEGIN { if ((coverage + 0) < (minimum + 0)) exit 1 }'
            printf '%s coverage: %s%%\n' "$name" "$coverage"
          }

          enforce memory memory-coverage.out 80
          enforce application application-coverage.out 80
          enforce conversation conversation-coverage.out 80

      - name: Repeat agent, tool, LLM, memory, audio, conversation, and application tests
        run: go test -count=20 ./internal/orchestrator ./internal/tools ./internal/llm ./internal/memory ./internal/audio ./internal/conversation ./internal/application

      - name: Race-test agent, tools, LLM, memory, audio, conversation, and application
        run: go test -race -count=1 ./internal/orchestrator ./internal/tools ./internal/llm ./internal/memory ./internal/audio ./internal/conversation ./internal/application

      - name: Build commands
        run: go build ./cmd/assistant ./cmd/calibrate

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            memory-coverage.out
            application-coverage.out
            conversation-coverage.out
