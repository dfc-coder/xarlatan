name: wi11a one-shot metric patch

on:
  push:
    branches:
      - "agent/wi-11a-streaming-replies"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-11a-streaming-replies
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Apply metric hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("internal/application/coordinator.go")
          text = path.read_text()
          old_delta = "result.Trace.FirstResponseDelta = recorder.elapsed()"
          if text.count(old_delta) != 2:
              raise SystemExit(f"expected 2 first-delta assignments, found {text.count(old_delta)}")
          text = text.replace(old_delta, "recorder.markFirstResponseDelta()")
          pattern = r"(?m)^(\s*)state\.firstAudio = true$"
          matches = list(re.finditer(pattern, text))
          if len(matches) != 1:
              raise SystemExit(f"expected 1 first-audio assignment, found {len(matches)}")
          text = re.sub(pattern, lambda m: m.group(0) + "\n" + m.group(1) + "recorder.markFirstAudio()", text, count=1)
          path.write_text(text)
          PY
      - name: Format and commit
        run: |
          gofmt -w internal/application/coordinator.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/application/coordinator.go
          git commit -m "fix(WI-11A): record first delta and audio metrics"
          git push origin HEAD:agent/wi-11a-streaming-replies
