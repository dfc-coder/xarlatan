name: wi11a one-shot metric patch

on:
  push:
    branches:
      - "agent/wi-11a-streaming-replies"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-11a-streaming-replies
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Apply metric hooks
        shell: python
        run: |
          from pathlib import Path
          path = Path("internal/application/coordinator.go")
          text = path.read_text()
          old_delta = "result.Trace.FirstResponseDelta = recorder.elapsed()"
          if text.count(old_delta) != 2:
              raise SystemExit(f"expected 2 first-delta assignments, found {text.count(old_delta)}")
          text = text.replace(old_delta, "recorder.markFirstResponseDelta()")
          old_audio = """state.wroteAudio = true
          if !state.firstAudio {
              state.firstAudio = true
          }"""
          new_audio = """state.wroteAudio = true
          if !state.firstAudio {
              state.firstAudio = true
              recorder.markFirstAudio()
          }"""
          if old_audio not in text:
              raise SystemExit("first-audio block not found")
          path.write_text(text.replace(old_audio, new_audio, 1))
      - name: Format and commit
        run: |
          gofmt -w internal/application/coordinator.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/application/coordinator.go
          git commit -m "fix(WI-11A): record first delta and audio metrics"
          git push origin HEAD:agent/wi-11a-streaming-replies
