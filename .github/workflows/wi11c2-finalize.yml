name: wi11c2 one-shot finalize

on:
  push:
    branches:
      - "agent/wi-11c2-partial-stt"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-11c2-partial-stt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends alsa-utils libasound2-dev
      - name: Finalize code and inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Scope FirstSTTPartial lookup to the observer runtime if an older
          # intermediate commit still contains the temporary global helper.
          p = Path('internal/application/application.go')
          text = p.read_text()
          old = '''\tif trace.FirstSTTPartial == 0 {
\t\ttrace.FirstSTTPartial = consumeFirstSTTPartial(r.turnID)
\t}
'''
          new = '''\tif trace.FirstSTTPartial == 0 {
\t\tif provider, ok := r.observer.(STTPartialMetricProvider); ok {
\t\t\ttrace.FirstSTTPartial = provider.ConsumeFirstSTTPartial(r.turnID)
\t\t}
\t}
'''
          if old in text:
              text = text.replace(old, new, 1)
          if 'provider.ConsumeFirstSTTPartial' not in text:
              raise SystemExit('FirstSTTPartial provider wiring missing')
          p.write_text(text)

          # Make the long-lived baseline inventory aware of WI-11C2 artifacts.
          p = Path('.github/workflows/baseline-inventory.yml')
          text = p.read_text()
          additions = [
              ('          test -f internal/audio/barge_capture_test.go\n',
               ['          test -f internal/audio/partial_capture_test.go\n']),
              ('          test -f internal/application/barge_in_test.go\n',
               ['          test -f internal/application/transcript.go\n',
                '          test -f internal/application/transcript_test.go\n']),
              ('          test -f cmd/assistant/capture_gate_observer_test.go\n',
               ['          test -f cmd/assistant/transcript_observer.go\n',
                '          test -f cmd/assistant/transcript_metric.go\n',
                '          test -f cmd/assistant/wi11c2_test.go\n']),
              ('          test -f docs/refactor/WI-11C1_SPEC.md\n',
               ['          test -f docs/refactor/WI-11C2_SPEC.md\n']),
          ]
          for anchor, lines in additions:
              missing = [line for line in lines if line not in text]
              if not missing:
                  continue
              if anchor not in text:
                  raise SystemExit(f'inventory anchor missing: {anchor!r}')
              text = text.replace(anchor, anchor + ''.join(missing), 1)
          p.write_text(text)
          PY

          rm -f .github/workflows/wi11c2-finish-metric.yml
          rm -f .github/workflows/wi11c2-inventory-patch.yml
          rm -f .github/workflows/wi11c2-finalize.yml
          gofmt -w internal/application/application.go internal/application/transcript.go internal/application/transcript_test.go internal/audio/continuous_capture.go internal/audio/partial_capture_test.go cmd/assistant/transcript_observer.go cmd/assistant/transcript_metric.go cmd/assistant/wi11c2_test.go

      - name: Vet and full tests
        run: |
          go mod download
          go vet ./...
          go test -count=1 ./...

      - name: Focused coverage
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -coverprofile=/tmp/application.out ./internal/application
          go test -count=1 -coverprofile=/tmp/audio.out ./internal/audio
          app="$(go tool cover -func=/tmp/application.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          aud="$(go tool cover -func=/tmp/audio.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v c="$app" 'BEGIN { if ((c+0) < 80) exit 1 }'
          awk -v c="$aud" 'BEGIN { if ((c+0) < 51.1) exit 1 }'
          printf 'application=%s\naudio=%s\n' "$app" "$aud" > /tmp/wi11c2-coverage

      - name: Repeat and race
        run: |
          go test -count=20 ./internal/application ./internal/audio ./internal/stt ./internal/wake ./internal/barge
          go test -race -count=1 ./internal/application ./internal/audio ./internal/stt ./internal/wake ./internal/barge

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          app="$(awk -F= '/application/ {print $2}' /tmp/wi11c2-coverage)"
          aud="$(awk -F= '/audio/ {print $2}' /tmp/wi11c2-coverage)"
          cat > docs/refactor/WI-11C2_EVIDENCE.md <<EOF
          # WI-11C2 evidence

          Validated on GitHub Actions ubuntu-24.04.

          - go vet ./...: PASS
          - go test -count=1 ./...: PASS
          - application coverage: ${app}% (minimum 80%)
          - audio coverage: ${aud}% (minimum 51.1%)
          - focused repeat x20: PASS
          - focused race: PASS
          - partial transcript remains data-plane only
          - final transcript remains authoritative for wake/memory/AgentRuntime
          EOF
          sed -i 's/^          //' docs/refactor/WI-11C2_EVIDENCE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(WI-11C2): validate partial and final STT lifecycle"
          git push origin HEAD:agent/wi-11c2-partial-stt
