name: wi11b one-shot apply

on:
  push:
    branches:
      - "agent/wi-11b-interrupt-path"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-11b-interrupt-path
      - name: Apply interruption lifecycle patches
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('internal/application/coordinator.go')
          text = p.read_text()

          replacements = [
              (
                  'type Coordinator struct {\n\tdependencies Dependencies\n\tsequence     atomic.Uint64\n}',
                  'type Coordinator struct {\n\tdependencies Dependencies\n\tsequence     atomic.Uint64\n\tinterrupts   InterruptSource\n}',
              ),
              (
                  '\t\tif IsErrorCode(err, ErrorCancelled) || IsErrorCode(err, ErrorDeadlineExceeded) {\n\t\t\treturn nil\n\t\t}',
                  '\t\tif IsErrorCode(err, ErrorInterrupted) {\n\t\t\tcontinue\n\t\t}\n\t\tif IsErrorCode(err, ErrorCancelled) || IsErrorCode(err, ErrorDeadlineExceeded) {\n\t\t\treturn nil\n\t\t}',
              ),
              (
                  '\tturnCtx, cancel := context.WithCancel(ctx)\n\tdefer cancel()',
                  '\tturnCtx, cancel := context.WithCancelCause(ctx)\n\tdefer cancel(nil)\n\tc.watchInterrupts(turnCtx, turnID, cancel)',
              ),
              (
                  '\t\tcase <-ctx.Done():\n\t\t\tc.abortStreamingPlayback(ctx, turnID, workers, state)\n\t\t\trecorder.emit(StateStopping)\n\t\t\treturn result, contextApplicationError(ctx.Err())',
                  '\t\tcase <-ctx.Done():\n\t\t\tc.abortStreamingPlayback(ctx, turnID, workers, state)\n\t\t\treturn c.fail(ctx, recorder, result, ErrorAgentFailed, ctx.Err())',
              ),
              (
                  '\tif ctxErr := ctx.Err(); ctxErr != nil {\n\t\trecorder.emit(StateStopping)\n\t\treturn result, contextApplicationError(ctxErr)\n\t}',
                  '\tif ctxErr := ctx.Err(); ctxErr != nil {\n\t\treturn c.fail(ctx, recorder, result, ErrorAgentFailed, ctxErr)\n\t}',
              ),
              (
                  'func (c *Coordinator) fail(ctx context.Context, recorder *turnRecorder, result Result, code ErrorCode, err error) (Result, error) {\n\tcontextErr := ctx.Err()',
                  'func (c *Coordinator) fail(ctx context.Context, recorder *turnRecorder, result Result, code ErrorCode, err error) (Result, error) {\n\tif interruptedContext(ctx) {\n\t\trecorder.emit(StateInterrupted)\n\t\tresult.Trace.Outcome = "interrupted"\n\t\tresult.Trace.ErrorCode = ErrorInterrupted\n\t\treturn result, interruptedApplicationError()\n\t}\n\tcontextErr := ctx.Err()',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'missing patch anchor: {old[:80]!r}')
              text = text.replace(old, new)

          p.write_text(text)

          inv = Path('.github/workflows/baseline-inventory.yml')
          inv_text = inv.read_text()
          anchors = [
              ('          test -f internal/application/coordinator_stream_test.go\n',
               '          test -f internal/application/interrupt.go\n          test -f internal/application/interrupt_test.go\n'),
              ('          test -f docs/refactor/WI-11A_SPEC.md\n',
               '          test -f docs/refactor/WI-11B_SPEC.md\n'),
          ]
          for anchor, extra in anchors:
              if extra not in inv_text:
                  if anchor not in inv_text:
                      raise SystemExit(f'inventory anchor missing: {anchor!r}')
                  inv_text = inv_text.replace(anchor, anchor + extra, 1)
          inv.write_text(inv_text)
          PY
          gofmt -w internal/application/coordinator.go internal/application/interrupt.go internal/application/interrupt_test.go
          rm .github/workflows/wi11b-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/application/coordinator.go internal/application/interrupt.go internal/application/interrupt_test.go .github/workflows/baseline-inventory.yml .github/workflows/wi11b-apply.yml
          git commit -m "feat(WI-11B): wire recoverable turn interruption"
          git push origin HEAD:agent/wi-11b-interrupt-path
