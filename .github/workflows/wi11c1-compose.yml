name: wi11c1 one-shot compose

on:
  push:
    branches:
      - "agent/wi-11c1-barge-in"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wi-11c1-barge-in
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Compose barge-in controller
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cmd/assistant/main.go')
          text = p.read_text()
          text = text.replace(
              '"github.com/dfc-coder/xarlatan/internal/audio"\n',
              '"github.com/dfc-coder/xarlatan/internal/audio"\n\t"github.com/dfc-coder/xarlatan/internal/barge"\n',
              1,
          )
          text = text.replace(
              '\twakeAliases     = flag.String("wake-aliases", "charlatan,charlatán", "comma-separated wake aliases")\n',
              '\twakeAliases     = flag.String("wake-aliases", "charlatan,charlatán", "comma-separated wake aliases")\n\tbargeEnabled    = flag.Bool("barge-in", true, "allow wake-qualified voice stop during playback")\n',
              1,
          )
          old = '''\tif *wakeEnabled {
\t\twakeDetector, err := wake.NewPhraseDetector(*wakeWord, splitWakeAliases(*wakeAliases))
\t\tif err != nil {
\t\t\treturn fmt.Errorf("wake detector: %w", err)
\t\t}
\t\tvoiceCoordinator.SetWakeDetector(wakeDetector)
\t}
\treturn voiceCoordinator.Run(ctx)
'''
          new = '''\twakeDetector, err := wake.NewPhraseDetector(*wakeWord, splitWakeAliases(*wakeAliases))
\tif err != nil {
\t\treturn fmt.Errorf("wake detector: %w", err)
\t}
\tif *wakeEnabled {
\t\tvoiceCoordinator.SetWakeDetector(wakeDetector)
\t}
\tif *bargeEnabled {
\t\tbargeController, err := application.NewBargeInController(
\t\t\trecorder,
\t\t\ttranscriber,
\t\t\tbarge.NewExplicitStopPolicy(wakeDetector),
\t\t)
\t\tif err != nil {
\t\t\treturn fmt.Errorf("barge-in controller: %w", err)
\t\t}
\t\tvoiceCoordinator.SetInterruptSource(bargeController)
\t}
\treturn voiceCoordinator.Run(ctx)
'''
          if old not in text:
              raise SystemExit('wake composition anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          gofmt -w cmd/assistant/main.go
          rm .github/workflows/wi11c1-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/assistant/main.go .github/workflows/wi11c1-compose.yml
          git commit -m "feat(WI-11C1): compose wake-qualified barge-in controller"
          git push origin HEAD:agent/wi-11c1-barge-in
