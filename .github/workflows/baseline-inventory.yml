name: baseline inventory

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "CHANGELOG.md"
      - "scripts/**"
      - "packaging/**"
      - "docs/**"
      - ".github/workflows/**"
  push:
    branches:
      - "agent/wi-00-baseline"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f internal/config/config_test.go
          test -f internal/config/vad_test.go
          test -f internal/tools/policy_test.go
          test -f internal/tools/web_security_test.go
          test -f internal/orchestrator/runtime_test.go
          test -f internal/orchestrator/stream_test.go
          test -f internal/llm/server_manager_test.go
          test -f internal/llm/stream_test.go
          test -f internal/memory/memory_test.go
          test -f internal/memory/prepare_test.go
          test -f internal/vad/detector.go
          test -f internal/vad/energy_compat.go
          test -f internal/vad/sherpa/silero.go
          test -f internal/vad/sherpa/silero_test.go
          test -f internal/wake/detector.go
          test -f internal/wake/detector_test.go
          test -f internal/barge/policy.go
          test -f internal/barge/policy_test.go
          test -f internal/audio/wi07_test.go
          test -f internal/audio/detector_test.go
          test -f internal/audio/persistent_playback_test.go
          test -f internal/audio/response_playback.go
          test -f internal/audio/continuous_capture.go
          test -f internal/audio/continuous_capture_test.go
          test -f internal/audio/continuous_playback_guard.go
          test -f internal/audio/barge_capture_test.go
          test -f internal/conversation/session_test.go
          test -f internal/conversation/stream_test.go
          test -f internal/application/application_test.go
          test -f internal/application/additional_test.go
          test -f internal/application/context_error_test.go
          test -f internal/application/stage_contract_test.go
          test -f internal/application/state_test.go
          test -f internal/application/coordinator.go
          test -f internal/application/coordinator_test.go
          test -f internal/application/coordinator_stream_test.go
          test -f internal/application/coordinator_stream_errors_test.go
          test -f internal/application/coordinator_stale_delta_test.go
          test -f internal/application/sentence_buffer.go
          test -f internal/application/sentence_buffer_test.go
          test -f internal/application/interrupt.go
          test -f internal/application/interrupt_test.go
          test -f internal/application/interrupt_latency_test.go
          test -f internal/application/barge_in.go
          test -f internal/application/barge_in_test.go
          test -f internal/application/wake.go
          test -f internal/application/wake_test.go
          test -f cmd/assistant/main_test.go
          test -f cmd/assistant/wi11a_test.go
          test -f cmd/assistant/capture_gate_observer.go
          test -f cmd/assistant/capture_gate_observer_test.go
          test -f cmd/assistant/shutdown_test.go
          test -f scripts/tests/wi08_contract_test.sh
          test -f scripts/tests/wi09_contract_test.sh
          test -f scripts/install.sh
          test -f scripts/uninstall.sh
          test -f scripts/rollback.sh
          test -f scripts/preflight.sh
          test -f scripts/beta_acceptance.sh
          test -f scripts/package_release.sh
          test -f scripts/collect_runtime_libs.sh
          test -f packaging/config.yaml
          test -f packaging/systemd/xarlatan.service
          ! grep -R --include='*.go' -n "github.com/local/assistant" cmd internal
          ! grep -n "github.com/local/assistant" go.mod go.sum
          test -f LICENSE
          test -f CHANGELOG.md
          test -f docs/BETA_RUNBOOK.md
          test -f docs/baseline/REPOSITORY_LAYOUT.md
          test -f docs/baseline/VALIDATION.md
          test -f docs/baseline/KNOWN_ISSUES.md
          test -f docs/refactor/WI-00_EVIDENCE.md
          test -f docs/refactor/WI-05_EVIDENCE.md
          test -f docs/refactor/WI-06_SPEC.md
          test -f docs/refactor/WI-06_EVIDENCE.md
          test -f docs/refactor/WI-07_SPEC.md
          test -f docs/refactor/WI-07_USAGE.md
          test -f docs/refactor/WI-07_EVIDENCE.md
          test -f docs/refactor/WI-08_SPEC.md
          test -f docs/refactor/WI-08_USAGE.md
          test -f docs/refactor/WI-08_EVIDENCE.md
          test -f docs/refactor/WI-09_SPEC.md
          test -f docs/refactor/WI-09_EVIDENCE.md
          test -f docs/refactor/WI-10A_SPEC.md
          test -f docs/refactor/WI-10B_SPEC.md
          test -f docs/refactor/WI-10C_SPEC.md
          test -f docs/refactor/WI-10D_SPEC.md
          test -f docs/refactor/WI-11A_SPEC.md
          test -f docs/refactor/WI-11B_SPEC.md
          test -f docs/refactor/WI-11C1_SPEC.md
          test -z "$(gofmt -l cmd internal)"
